<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Hub</title>
<meta name="theme-color" content="#2A2A28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="runtime.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a working app. Left rail of six views, summary first on Today. Monochrome: sand, white and near-black, heavy grotesk headings, mono labels, one red signal used only for today and delete. */
:root{
  --bg:#F1F1EF; --surface:#F8F8F6; --sunken:#E6E6E3;
  --ink:#343432; --muted:#75756F; --line:#DCDCD8;
  --accent:#3A3A38; --accent-soft:#EEEEEB; --on-accent:#F8F8F6;
  --good:#3A3A38; --good-soft:#E6E6E3; --warn:#75756F; --warn-soft:#EEEEEB; --signal:#C4483C;
  --navhd:#EBDACB; --navhd-ink:#3B2F27; --navbar:#C47B45;
  --display:"Archivo","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#2A2A28; --surface:#343432; --sunken:#222221;
    --ink:#DCDCD7; --muted:#A0A09A; --line:#464643;
    --accent:#DCDCD7; --accent-soft:#3D3D3A; --on-accent:#2A2A28;
    --good:#DCDCD7; --good-soft:#464643; --warn:#A0A09A; --warn-soft:#3D3D3A; --signal:#E8796D;
    --navhd:#4A3B30; --navhd-ink:#F1E1D2; --navbar:#D8915C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --navhd:#4A3B30; --navhd-ink:#F1E1D2; --navbar:#D8915C;
  --bg:#2A2A28; --surface:#343432; --sunken:#222221;
  --ink:#DCDCD7; --muted:#A0A09A; --line:#464643;
  --accent:#DCDCD7; --accent-soft:#3D3D3A; --on-accent:#2A2A28;
  --good:#DCDCD7; --good-soft:#464643; --warn:#A0A09A; --warn-soft:#3D3D3A; --signal:#E8796D;
}
:root{color-scheme:light}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
input[type=date],input[type=time]{color-scheme:light}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{opacity:.85;cursor:pointer;filter:none}
:root[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator,:root[data-theme="dark"] input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input[type=date]::-webkit-calendar-picker-indicator,:root:not([data-theme="light"]) input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
nav{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--bg)}
nav .brand{font-family:var(--display);font-weight:700;font-size:1.25rem;padding:4px 10px 14px}
nav a{display:block;text-decoration:none;color:var(--ink);font-weight:600;padding:9px 10px;border-radius:10px}
nav a:hover{background:var(--surface)}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{padding:26px 24px 60px;max-width:1040px;width:100%;display:flex;flex-direction:column;gap:20px}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;gap:4px}
  nav .brand{display:none}
  nav a{flex:none;padding:7px 12px}
  main{padding:18px 16px 60px}
}
.head{display:flex;flex-direction:column;gap:4px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.84rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.active{background:var(--accent-soft);color:var(--accent)}
.pill.done,.pill.have{background:var(--good-soft);color:var(--good)}
.pill.needed{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
.btn.danger{color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:default}
input[type=text],input[type=date],input[type=url],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:64px;width:100%}
.f{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.f label{font-size:.78rem;font-weight:700;color:var(--muted)}
.f input,.f select{width:100%}
form.add{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.check li{display:flex;gap:9px;align-items:flex-start}
ul.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
ul.check .t{flex:1;overflow-wrap:anywhere}
ul.check .done{color:var(--muted);text-decoration:line-through}
.goal{cursor:default}
.goal .title{background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.detail{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;background:var(--sunken);color:var(--muted);padding:3px 9px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.ai{background:var(--sunken);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.entry{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:86px}
.lv{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line);padding:4px 0 4px 12px}
.lv.at{border-left-color:var(--accent)}
.lv .g{display:flex;gap:8px;align-items:center;justify-content:space-between}
.top{font-size:.9rem}
.top b{color:var(--accent)}
.subrow{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;font-weight:600}
.subrow:hover{color:var(--accent)}
.subrow span{font-size:.8rem;color:var(--muted);font-weight:500}
.ideas{display:flex;flex-direction:column;gap:6px;padding:4px 0 12px}
.ideas h4{margin:6px 0 0;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ideas h4.hi{color:var(--accent)}
.idea{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.93rem}
.hab{display:grid;grid-template-columns:auto minmax(110px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hab:last-of-type{border-bottom:0}
.hab input{width:20px;height:20px;accent-color:var(--accent)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:14px;height:14px;border-radius:4px;border:0;padding:0;background:var(--sunken);cursor:pointer}
.dot.on{background:var(--accent)}
.dot.today{outline:2px solid var(--ink);outline-offset:1px}
.streak{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.spark{width:100%;height:46px;display:block}
.back{align-self:flex-start;padding-left:0}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.res{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.res:first-of-type{border-top:0}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
/* monochrome treatment */
h1{font-weight:900;font-size:2.1rem;letter-spacing:-.025em}
h2{font-weight:800;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
h3{font-weight:700}
nav .brand{font-weight:900;letter-spacing:-.02em}
nav{gap:0;padding:22px 16px}
nav .brand{font-size:1.4rem;padding:2px 2px 18px;border-bottom:1px solid var(--ink)}
nav a{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:13px 2px;border-radius:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
nav a:hover{background:none;color:var(--ink)}
nav a[aria-current="page"]{background:none;color:var(--ink)}
nav a[aria-current="page"]::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
@media (max-width:760px){
  nav{padding:0 14px;gap:16px}
  nav a{border-bottom:2px solid transparent;padding:13px 0 11px}
  nav a[aria-current="page"]{border-bottom-color:var(--ink)}
  nav a[aria-current="page"]::after{display:none}
}
.f label,.pill,.streak,.entry time,.tile span,.ideas h4,th{font-family:var(--mono);font-weight:500;letter-spacing:0}
.f label,.tile span{text-transform:lowercase}
.tile b{font-weight:900;font-size:2.6rem;letter-spacing:-.04em}
.card,.tile{border-color:var(--line)}
.pill{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.active,.pill.have,.pill.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.draft,.pill.needed{border-style:dashed;color:var(--ink)}
.btn{border-radius:999px;border-color:var(--ink);background:transparent}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.85}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.danger{color:var(--signal);border-color:var(--signal)}
.btn.danger:hover{background:var(--signal);color:#fff}
input[type=text],input[type=date],input[type=url],select,textarea{border-radius:12px;background:var(--accent-soft)}
.note{background:var(--surface);border:1px dashed var(--line)}
.ai{font-size:.93rem}
.banner{background:var(--surface);color:var(--signal);border:1px solid var(--signal)}
.dot{border-radius:5px}
.dot.today{outline-color:var(--signal)}
.ideas h4.hi{color:var(--ink)}
.ideas h4.hi::before{content:"★ "}
.subrow:hover{color:var(--ink);text-decoration:underline}
.lv.at{border-left-color:var(--ink)}
.top b{color:var(--ink)}
summary,a{color:var(--ink)}
ul.check input,.hab input{accent-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0;text-transform:lowercase}
.cal button{aspect-ratio:1;border:1px solid transparent;background:none;border-radius:10px;cursor:pointer;font-family:var(--mono);font-size:.86rem;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;min-width:0}
.cal button:hover{background:var(--sunken)}
.cal button.out{color:var(--muted);opacity:.55}
.cal button.now{border-color:var(--signal)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal .mk{display:flex;gap:2px;height:5px}
.cal .mk i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.cal .mk i.due{background:none;border:1px solid currentColor}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.task{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.task input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--ink);flex:none}
.task .tm{font-family:var(--mono);font-size:.8rem;color:var(--muted);flex:none;width:44px;padding-top:2px}
.task .tx{flex:1;min-width:0;overflow-wrap:break-word}
.task .tx.done{color:var(--muted);text-decoration:line-through}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:start}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.daycol.now{border-color:var(--signal)}
.daycol h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.daycol .dt{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.daycol input[type=text]{width:100%;font-size:.88rem;padding:6px 9px}
input[type=time]{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--mono);font-size:.84rem;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink);font:inherit;min-width:0}
.mtile:hover{border-color:var(--ink)}
.mtile.now{border-color:var(--signal)}
.mtile b{font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase}
.mtile span{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.mtile .meta{font-family:var(--mono);font-size:.76rem}
.ctx{border-left:3px solid var(--ink);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.ctx .lbl{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-transform:lowercase}
.daycol h3 button{border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.wkrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer;color:var(--ink);font:inherit}
.wkrow:hover b{text-decoration:underline}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
.bars span{font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap}
.hbar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:.9rem}
.hbar i{display:block;height:10px;background:var(--ink);border-radius:999px;min-width:2px}
.hbar span:last-child{font-family:var(--mono);font-size:.8rem;text-align:right}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mini input[type=text],.mini select{font-size:.88rem;padding:6px 9px;width:100%}
.exrow{display:grid;grid-template-columns:minmax(90px,2fr) 54px 54px 76px auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.exrow:last-of-type{border-bottom:0}
.exrow input{padding:5px 7px;font-size:.86rem;width:100%;min-width:0}
.exhead{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-transform:lowercase;border-bottom:1px solid var(--ink)}
.foodrow{display:grid;grid-template-columns:minmax(80px,2fr) repeat(5,minmax(40px,1fr)) auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}
.foodrow input{padding:5px 6px;font-size:.84rem;width:100%;min-width:0}
.foodrow.exhead{font-size:.7rem}
.macro{display:flex;flex-direction:column;gap:5px}
.macro b{font-family:var(--display);font-weight:900;font-size:1.5rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.macro span{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:110px;height:146px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:4px;right:4px;background:var(--surface)}
.nfl{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.vh{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-top:10px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.vh h2{font-size:1.2rem;font-weight:900;letter-spacing:.04em}
.vh span{font-family:var(--mono);font-size:.84rem;color:var(--muted)}
.daycol.fixed .dayrows{height:190px;overflow:hidden;display:flex;flex-direction:column}
.daycol.fixed .dayrows .task{height:38px;flex:none;padding:0;align-items:center;border-bottom:1px solid var(--line)}
.daycol.fixed .dayrows .task .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}
.daycol.fixed .dayrows .task .tx .small{display:none}
.daycol.fixed .dayrows .task .tm{width:auto;padding-top:0}
.daycol.fixed .dayrows .task input[type=checkbox]{margin-top:0}

function plan(id){
  var g=S.goals[id];if(!g||!ask)return;
  ui.plan[id]={loading:true};render();
  var p="You are helping someone plan a personal or business goal inside their goal tracker. Today is "+today()+".\nGoal: "+g.title+"\nArea: "+areaName(g.area)+(g.sub?" / "+g.sub:"")+"\nTarget: "+(g.target||"not set")+"\nDeadline: "+(g.due||"not set")+"\nWhy it matters: "+(g.why||"not given")+"\nExisting milestones: "+JSON.stringify((g.milestones||[]).map(function(x){return x.t}))+"\nExisting steps: "+JSON.stringify((g.steps||[]).map(function(x){return x.t}))+"\n\nReturn ONLY a JSON object, no other text, with this shape: {\"milestones\":[3 to 5 short strings, measurable checkpoints in order],\"steps\":[5 to 8 short strings, concrete actions, soonest first, each doable in one sitting],\"skills\":[0 to 3 objects {\"name\":\"kebab-case-name\",\"does\":\"one sentence\"} for reusable Claude skills that would help with this goal],\"note\":\"one sentence on the biggest risk or assumption\"}. Do not repeat existing items. "+GUARD;
  ask(p,{cache:false}).then(function(r){
    var m=(r&&r.text||"").match(/\{[\s\S]*\}/),d=null;try{d=m&&JSON.parse(m[0])}catch(e){}
    ui.plan[id]=d?{data:d}:{error:"Claude's answer came back in an unexpected shape. Try again."};render();
